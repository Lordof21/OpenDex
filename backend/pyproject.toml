[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "opendex-backend"
version = "0.1.0"
description = "OpenDeX backend — Android multi-window mirroring session/resource orchestrator"
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "aiosqlite>=0.20",
    "zeroconf>=0.132",
    "websockets>=12.0",
    "Pillow>=10",
    "send2trash>=1.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.4",
    "openapi-spec-validator>=0.7",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Scoped to pyflakes (dead code: unused imports/variables, undefined names) —
# the category this codebase is clean against today and that CI enforces.
# Widen incrementally (style/modernization rules) as separate cleanup passes
# land; don't let an unrelated lint sweep block this gate.
select = ["F"]
